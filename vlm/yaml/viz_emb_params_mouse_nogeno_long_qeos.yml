# Mouse atherosclerosis trajectory VLM — text generation + multitask heads (TBR regression, genotype classification)
# Adapted from NephrologyKG/yaml/viz_emb_params_nlst.yml
#
# CANONICAL CONFIG — this is the default loaded by run/run_mouse_vlm_loso.py and
# reproduces the headline result (genotype acc 0.719 / AUROC 0.762, overall TBR R² +0.104).
# Longitudinal 4-token input, r=4 q/v LoRA, multitask_wt=5, z-scored TBR, 20 epochs.
# viz_emb_params_mouse_ep20.yml is an identical copy kept for experiment provenance.

exp:
  output_dir: /data1/Processed_NIfTI_Test/embeddings/vlm/runs/mouse_vlm_nogeno_long_ep20_qeos_seed0

data:
  train_dataset: mouse_traj_vqa
  inf_dataset: mouse_traj_vqa
  tokenizer_name: meta-llama/Meta-Llama-3.1-8B-Instruct
  base_dir: ""
  img_dir: ""
  inf_img_dir: ""
  data_path: /data1/Processed_NIfTI_Test/embeddings/vlm/mouse_train_vqa_traj.json
  inf_data_path: /data1/Processed_NIfTI_Test/embeddings/vlm/mouse_val_vqa_traj.json
  data_seed: 0
  test_size: 0.2
  height: 224
  width: 224
  num_channels: 3
  img_tokens: 4
  predicted_emb_dir: /data1/Processed_NIfTI_Test/embeddings/longitudinal_nogeno/predicted_embeddings
  seq_length: 150
  prompt_type: "standard"

train:
  save_model_name: mouse_vlm_mdl
  model_name: null
  vision_model_name: None
  freeze_vision_model: True
  freeze_llm_model: False
  llm_model_name: meta-llama/Meta-Llama-3.1-8B-Instruct
  pretrained: False
  load_projection_matrix: False
  use_quantization: True
  r: 4
  lora_alpha: 16
  target_modules: ["q_proj", "v_proj"]
  lora_dropout: 0.1
  bias: "none"
  task_type: "CAUSAL_LM"
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 4
  num_train_epochs: 20
  learning_rate: 2.0e-4
  fp16: False
  bf16: True
  optim: adamw_torch_fused
  lr_scheduler_type: cosine
  warmup_ratio: 0.05
  save_total_limit: 1
  logging_steps: 1
  num_proj_layers: 1
  label_names: ["labels", "tbr_targets", "genotype_label"]
  save_strategy: epoch
  evaluation_strategy: epoch
  eval_steps: null
  save_steps: null
  # F2: under LOSO the Trainer's eval_dataset IS the held-out subject, so selecting
  # the best checkpoint on it selects on the test set (+0.14 to +0.20 AUROC of
  # measured inflation, growing with epoch count). false = take the final epoch.
  # Only set true after carving a validation subject out of the 31 training subjects.
  load_best_model_at_end: False
  # F3: "answer_eos" pools the multitask heads at the answer-terminal EOS, but the
  # answer states the genotype label and is absent at inference, so the decision
  # threshold does not transfer (AUROC 1.000 alongside accuracy 0.500 in the probe).
  # "question_eos" pools at the question-terminal EOS, identical in train and
  # inference. Changing this changes training — run it as an explicit ablation.
  pool_at: question_eos
  add_multitask: True
  add_multitask_unknown: False
  multitask_wt: 5.0
  evaluate_start: False
  resume_from_checkpoint: False
  report_to: "tensorboard"

inf:
  model_name: /data1/Processed_NIfTI_Test/embeddings/vlm/runs/mouse_vlm_nogeno_long_ep20_qeos_seed0/mouse_vlm_mdl
  llm_model_name: meta-llama/Meta-Llama-3.1-8B-Instruct
  load_projection_matrix: False
  use_quantization: True
  r: 4
  lora_alpha: 16
  target_modules: ["q_proj", "v_proj"]
  lora_dropout: 0.1
  bias: "none"
  task_type: "CAUSAL_LM"
  beg_prompt: ""
  mid_prompt: ""
  end_prompt: ""
  replace_prompt: null
  max_new_tokens: 100
  decoding_kwargs:
    num_beams: 1
    do_sample: False
  include_img: True
  save_file: vqa.json
  results_file: val.json
  train_gt_file: /data1/Processed_NIfTI_Test/embeddings/vlm/mouse_train_vqa_traj.json
